<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DIVA — Recortar Foto</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,sans-serif;overflow:hidden;}
body{display:flex;flex-direction:column;}

/* SCREENS */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;}
.screen.hidden{display:none;}

/* INPUT SCREEN */
#inputScreen{background:#111;align-items:center;justify-content:center;padding:28px;}
.big-icon{font-size:60px;margin-bottom:18px;}
.inp-title{font-size:22px;font-weight:700;margin-bottom:8px;text-align:center;}
.inp-sub{font-size:13px;color:rgba(255,255,255,0.45);text-align:center;line-height:1.7;margin-bottom:28px;max-width:300px;}
.inp{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:14px 16px;color:#fff;font-size:15px;outline:none;font-family:inherit;margin-bottom:10px;}
.inp:focus{border-color:#4DB6AC;}
.inp-btn{width:100%;background:#C2185B;color:#fff;border:none;border-radius:12px;padding:16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.divider{color:rgba(255,255,255,0.25);font-size:12px;margin:12px 0;text-align:center;}
.upload-btn{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);border-radius:12px;padding:16px;font-size:14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;}
input[type=file]{display:none;}

/* CROP SCREEN */
#cropScreen{background:#000;}
.crop-nav{height:54px;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;}
.nav-btn{background:none;border:none;color:rgba(255,255,255,0.7);font-size:15px;padding:8px;cursor:pointer;min-width:60px;}
.nav-btn.confirm{color:#C2185B;font-weight:700;text-align:right;}
.nav-title{font-size:15px;font-weight:600;}
.crop-area{flex:1;position:relative;overflow:hidden;touch-action:none;}
canvas{display:block;}
.crop-bottom{background:rgba(0,0,0,0.95);padding:12px 16px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.08);}
.ratio-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:10px;}
.ratio-scroll::-webkit-scrollbar{display:none;}
.r-btn{flex-shrink:0;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.65);font-size:11px;padding:7px 14px;border-radius:20px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.r-btn.active{background:rgba(194,24,91,0.25);border-color:#C2185B;color:#fff;}
.hint{font-size:11px;color:rgba(255,255,255,0.3);text-align:center;}
.action-row{display:flex;gap:10px;margin-top:10px;}
.a-btn{flex:1;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:#fff;font-size:12px;padding:12px;border-radius:8px;cursor:pointer;font-family:inherit;}
.a-btn.primary{background:rgba(194,24,91,0.25);border-color:#C2185B;}

/* RESULT SCREEN */
#resultScreen{background:#000;}
.result-nav{height:54px;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.08);}
.result-img-area{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;background:#0a0a0a;overflow:hidden;}
.result-img-area img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain;}
.result-bottom{background:#111;padding:16px;border-top:1px solid rgba(255,255,255,0.08);flex-shrink:0;}
.result-label{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
.result-id{font-size:12px;color:#4DB6AC;word-break:break-all;background:rgba(77,182,172,0.08);border:1px solid rgba(77,182,172,0.2);border-radius:8px;padding:10px 12px;margin-bottom:10px;line-height:1.5;}
.copy-btn{width:100%;background:#C2185B;color:#fff;border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;}

/* TOAST */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 22px;border-radius:22px;opacity:0;transition:.3s;font-size:13px;z-index:9999;border:1px solid rgba(255,255,255,0.1);pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<!-- INPUT -->
<div class="screen" id="inputScreen">
  <div class="big-icon">✂️</div>
  <div class="inp-title">Recortar foto</div>
  <div class="inp-sub">Pegá el Public ID de Cloudinary, o elegí una foto de tu dispositivo</div>
  <input class="inp" id="pidInput" type="text" placeholder="Ej: IMG_3829_bmhks5" autocomplete="off" autocorrect="off" spellcheck="false">
  <button class="inp-btn" onclick="loadCloud()">Cargar →</button>
  <div class="divider">— o —</div>
  <button class="upload-btn" onclick="document.getElementById('fi').click()">📁 Elegir del dispositivo</button>
  <input type="file" id="fi" accept="image/*" onchange="loadFile(this)">
</div>

<!-- CROP -->
<div class="screen hidden" id="cropScreen">
  <div class="crop-nav">
    <button class="nav-btn" onclick="goInput()">← Atrás</button>
    <span class="nav-title">Ajustar</span>
    <button class="nav-btn confirm" onclick="doCrop()">Usar →</button>
  </div>
  <div class="crop-area" id="cropArea">
    <canvas id="c"></canvas>
  </div>
  <div class="crop-bottom">
    <div class="ratio-scroll">
      <button class="r-btn active" onclick="setR(1,1,this)">■ Producto (1:1)</button>
      <button class="r-btn" onclick="setR(16,9,this)">▬ Hero (16:9)</button>
      <button class="r-btn" onclick="setR(3,4,this)">▮ Categoría (3:4)</button>
      <button class="r-btn" onclick="setR(16,8,this)">▬ Cat. ancha</button>
    </div>
    <div class="hint">Arrastrá para mover · Pellizgá para hacer zoom</div>
    <div class="action-row">
      <button class="a-btn" onclick="centerImg()">↺ Centrar</button>
      <button class="a-btn primary" onclick="doCrop()">✓ Confirmar</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div class="screen hidden" id="resultScreen">
  <div class="result-nav">
    <button class="nav-btn" onclick="goBack()">← Editar</button>
    <span class="nav-title">Resultado</span>
    <button class="nav-btn confirm" onclick="copyAndClose()">✅ Listo</button>
  </div>
  <div class="result-img-area">
    <img id="rImg" src="" alt="resultado">
  </div>
  <div class="result-bottom">
    <div class="result-label">Copiá esto y pegalo en el campo "Foto" del admin</div>
    <div class="result-id" id="rId"></div>
    <button class="copy-btn" onclick="copyId()">📋 Copiar y usar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CLD='dnixftrzb';
let cvs=document.getElementById('c');
let ctx=cvs.getContext('2d');
let img=new Image();
let pid='';
let rW=1,rH=1;
let sc=1,minSc=0.1;
let ox=0,oy=0;
let cW=0,cH=0;

// Touch
let t1={x:0,y:0},t2={x:0,y:0};
let dragging=false,dSX=0,dSY=0,dSOX=0,dSOY=0;
let lastDist=0;
let mouseDown=false,mSX=0,mSY=0,mSOX=0,mSOY=0;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function goInput(){show('inputScreen');}
function goBack(){show('cropScreen');}

function loadCloud(){
  const id=document.getElementById('pidInput').value.trim();
  if(!id){toast('Ingresá el Public ID');return;}
  pid=id;
  const url=`https://res.cloudinary.com/${CLD}/image/upload/q_auto,f_auto/${id}`;
  loadImgUrl(url);
}
function loadFile(inp){
  const f=inp.files[0];if(!f)return;
  pid=f.name.replace(/\.[^.]+$/,'');
  const r=new FileReader();
  r.onload=e=>loadImgUrl(e.target.result);
  r.readAsDataURL(f);
}
function loadImgUrl(url){
  const i=new Image();
  i.crossOrigin='anonymous';
  i.onload=()=>{img=i;show('cropScreen');setTimeout(()=>{resize();centerImg();},80);};
  i.onerror=()=>toast('No se pudo cargar. Verificá el ID.');
  i.src=url;
}

function setR(w,h,btn){
  rW=w;rH=h;
  document.querySelectorAll('.r-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  resize();centerImg();
}

function resize(){
  const area=document.getElementById('cropArea');
  const aw=area.clientWidth,ah=area.clientHeight;
  const mar=40;
  const maxW=aw-mar*2,maxH=ah-mar*2;
  if(rW/rH>maxW/maxH){cW=maxW;cH=Math.round(maxW*rH/rW);}
  else{cH=maxH;cW=Math.round(maxH*rW/rH);}
  cvs.width=cW;cvs.height=cH;
  cvs.style.width=cW+'px';cvs.style.height=cH+'px';
  // Center canvas in area
  cvs.style.position='absolute';
  cvs.style.left=Math.round((aw-cW)/2)+'px';
  cvs.style.top=Math.round((ah-cH)/2)+'px';
}

function centerImg(){
  const sw=cW/img.naturalWidth,sh=cH/img.naturalHeight;
  sc=Math.max(sw,sh);
  minSc=sc*0.8;
  ox=(cW-img.naturalWidth*sc)/2;
  oy=(cH-img.naturalHeight*sc)/2;
  draw();
}

function clamp(){
  const iw=img.naturalWidth*sc,ih=img.naturalHeight*sc;
  if(iw>=cW){ox=Math.min(0,Math.max(cW-iw,ox));}else{ox=(cW-iw)/2;}
  if(ih>=cH){oy=Math.min(0,Math.max(cH-ih,oy));}else{oy=(cH-ih)/2;}
}

function draw(){
  ctx.clearRect(0,0,cW,cH);
  ctx.save();
  ctx.translate(ox,oy);
  ctx.scale(sc,sc);
  ctx.drawImage(img,0,0);
  ctx.restore();
  // Border
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;
  ctx.strokeRect(1,1,cW-2,cH-2);
  // Thirds
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
  for(let i=1;i<3;i++){
    ctx.beginPath();ctx.moveTo(cW*i/3,0);ctx.lineTo(cW*i/3,cH);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,cH*i/3);ctx.lineTo(cW,cH*i/3);ctx.stroke();
  }
}

// Touch events
cvs.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(e.touches.length===1){
    dragging=true;
    dSX=e.touches[0].clientX;dSY=e.touches[0].clientY;
    dSOX=ox;dSOY=oy;lastDist=0;
  }else if(e.touches.length===2){
    dragging=false;
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    lastDist=Math.sqrt(dx*dx+dy*dy);
  }
},{passive:false});

cvs.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&dragging){
    ox=dSOX+(e.touches[0].clientX-dSX);
    oy=dSOY+(e.touches[0].clientY-dSY);
    clamp();draw();
  }else if(e.touches.length===2&&lastDist>0){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2;
    const my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    const rect=cvs.getBoundingClientRect();
    const cx=mx-rect.left,cy=my-rect.top;
    const delta=dist/lastDist;
    const ns=Math.max(minSc,Math.min(sc*delta,minSc*10));
    const sr=ns/sc;
    ox=cx-sr*(cx-ox);oy=cy-sr*(cy-oy);
    sc=ns;clamp();draw();
    lastDist=dist;
  }
},{passive:false});

cvs.addEventListener('touchend',e=>{
  if(e.touches.length<2)lastDist=0;
  if(e.touches.length===0)dragging=false;
},{passive:false});

// Mouse
cvs.addEventListener('mousedown',e=>{mouseDown=true;mSX=e.clientX;mSY=e.clientY;mSOX=ox;mSOY=oy;});
window.addEventListener('mousemove',e=>{
  if(!mouseDown)return;
  ox=mSOX+(e.clientX-mSX);oy=mSOY+(e.clientY-mSY);clamp();draw();
});
window.addEventListener('mouseup',()=>mouseDown=false);
cvs.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=cvs.getBoundingClientRect();
  const cx=e.clientX-rect.left,cy=e.clientY-rect.top;
  const delta=e.deltaY<0?1.12:0.88;
  const ns=Math.max(minSc,Math.min(sc*delta,minSc*10));
  const sr=ns/sc;
  ox=cx-sr*(cx-ox);oy=cy-sr*(cy-oy);sc=ns;clamp();draw();
},{passive:false});

// CROP & RESULT
function doCrop(){
  // Coordinates in image space
  const ix=Math.max(0,Math.round(-ox/sc));
  const iy=Math.max(0,Math.round(-oy/sc));
  const iw=Math.min(img.naturalWidth-ix,Math.round(cW/sc));
  const ih=Math.min(img.naturalHeight-iy,Math.round(cH/sc));
  const outW=800,outH=Math.round(800*rH/rW);
  const transform=`c_crop,x_${ix},y_${iy},w_${iw},h_${ih}/c_scale,w_${outW},h_${outH},q_auto,f_auto`;
  const url=`https://res.cloudinary.com/${CLD}/image/upload/${transform}/${pid}`;
  const adminId=`${transform}/${pid}`;
  document.getElementById('rImg').src=url;
  document.getElementById('rId').textContent=adminId;
  // Save for hero
  if(rW===16)localStorage.setItem('diva_hero_override',url);
  show('resultScreen');
}

function copyId(){
  const txt=document.getElementById('rId').textContent;
  navigator.clipboard.writeText(txt).then(()=>toast('¡Copiado! Pegalo en el campo Foto del admin ✓'));
}
function copyAndClose(){
  copyId();
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

window.addEventListener('resize',()=>{
  if(img.naturalWidth>0){resize();clamp();draw();}
});
</script>
</body>
</html>
